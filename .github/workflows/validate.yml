name: Validate documents

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Validates every document's front matter against schema/document.schema.json,
      # so a malformed document cannot merge and break website ingestion.
      # Implementation lands with the first content document.
      - name: Validate front matter
        run: echo "Validator to be implemented alongside the first content document."
