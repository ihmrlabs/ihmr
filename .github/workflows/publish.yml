name: Publish

# Publishing mints DOIs, and a published DOI cannot be deleted.
#
# What gets published is decided by the state of the papers, not by the push
# that triggered the run. A paper is eligible when it is signed off, has no DOI
# yet, and carries a publishable status. See schema/eligible_for_publication.py.
#
# That makes the whole thing idempotent, which is what makes it safe. Re-running
# a failed job, merging a stale branch, or pushing twice publishes nothing:
# everything eligible already has a DOI, so nothing is eligible any more.
#
# The flow:
#
#   PR into submit-papers   → dry run. Lists what would publish. Mints nothing.
#   merge to submit-papers  → mints for every eligible paper, opens a PR to main
#   merge that PR to main   → syncs, ingests, goes live
#
# submit-papers is protected exactly like main, so reaching it needs a reviewed
# pull request. Nobody publishes by pushing.

on:
  push:
    branches: [submit-papers]
  pull_request:
    branches: [submit-papers]
  workflow_dispatch:
    inputs:
      sandbox:
        description: 'Use the Zenodo sandbox (fake DOIs, for rehearsal)'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ihmrlabs/ihmr-engine
          path: engine
          # Public repository. Reading it needs no token.

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Validate the corpus
        run: |
          python3 schema/validate.py .
          python3 schema/validate_manifests.py .

      - name: Work out what is eligible
        id: scan
        run: |
          python3 schema/eligible_for_publication.py . | tee /tmp/report.txt
          echo "papers=$(python3 schema/eligible_for_publication.py . --json)" >> "$GITHUB_OUTPUT"
          COUNT=$(python3 -c "
          import json,subprocess
          print(json.loads(subprocess.check_output(
            ['python3','schema/eligible_for_publication.py','.','--json']))['count'])")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # A pull request into submit-papers is the rehearsal. It reports exactly
      # what a merge would publish, and mints nothing.
      - name: Dry run report
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## What merging this would publish"
            echo
            echo '```'
            cat /tmp/report.txt
            echo '```'
            echo
            if [ "${{ steps.scan.outputs.count }}" = "0" ]; then
              echo "**Nothing would be published.** Every paper is either unsigned, already"
              echo "published, or not in a publishable status."
            else
              echo "**Merging this would mint ${{ steps.scan.outputs.count }} permanent DOI(s).**"
              echo "A DOI cannot be deleted. Check the signatures before approving."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to do
        if: github.event_name != 'pull_request' && steps.scan.outputs.count == '0'
        run: |
          echo "Nothing is eligible. This is the normal outcome for a re-run." >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Install pandoc and LaTeX
        if: github.event_name != 'pull_request' && steps.scan.outputs.count != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra

      # ---------- Everything below only runs for a real publication ----------

      - name: Publish every eligible paper
        if: github.event_name != 'pull_request' && steps.scan.outputs.count != '0'
        env:
          ZENODO_API_TOKEN: ${{ secrets.ZENODO_API_TOKEN }}
          ZENODO_SANDBOX: ${{ github.event_name == 'workflow_dispatch' && inputs.sandbox && '1' || '0' }}
          ZENODO_COMMUNITY: ${{ github.event_name == 'workflow_dispatch' && inputs.sandbox && '' || 'ihmr' }}
          # Through the environment, never interpolated into the shell. A title
          # containing an apostrophe - "The State of India's Healthcare" - ends
          # the quoting and the rest of the JSON is run as commands.
          PAPERS: ${{ steps.scan.outputs.papers }}
        run: |
          python3 <<'PYTHON'
          import json, os, subprocess, sys, pathlib, re

          papers = json.loads(os.environ['PAPERS'])['papers']
          published, failed = [], []

          for p in papers:
              work = pathlib.Path(p['folder']) / p['work']
              version = p['version']
              print(f"--- {p['work']} v{version} ---", flush=True)

              try:
                  subprocess.run(['python3', 'engine/apps/publish/mint_doi.py', 'reserve',
                                  '--work', str(work), '--version', str(version)], check=True)

                  doi = json.loads((work / f'v{version}' / '.zenodo.json').read_text())['doi']

                  # Into the article, so the PDF built from it carries its own
                  # identifier. A PDF travels away from the site and a copy
                  # without its DOI cannot be cited.
                  manifest = json.loads((work / 'manifest.json').read_text())
                  entry = next(v for v in manifest['versions'] if v['version'] == version)
                  doc = work / f'v{version}' / entry['document']
                  doc.write_text(re.sub(r'^doi:.*$', f'doi: {doi}', doc.read_text(), count=1, flags=re.M))

                  entry['doi'] = doi
                  if not manifest.get('conceptDoi'):
                      manifest['conceptDoi'] = doi
                  (work / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')

                  subprocess.run(['python3', 'engine/apps/publish/build_pdf.py',
                                  '--work', str(work), '--version', str(version)], check=True)

                  pdfs = list((work / f'v{version}').glob('*.pdf'))
                  if pdfs:
                      entry['pdf'] = pdfs[0].name
                      (work / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')

                  subprocess.run(['python3', 'engine/apps/publish/mint_doi.py', 'publish',
                                  '--work', str(work), '--version', str(version)], check=True)

                  (work / f'v{version}' / '.zenodo.json').unlink(missing_ok=True)
                  published.append((p['work'], version, doi))

              except subprocess.CalledProcessError as e:
                  # One paper failing must not strand the others. Those already
                  # minted keep their DOIs and still reach the pull request.
                  print(f'FAILED: {e}', file=sys.stderr)
                  failed.append((p['work'], version, str(e)))

          pathlib.Path('/tmp/published.json').write_text(json.dumps({
              'published': published, 'failed': failed,
          }))
          print(f"\nPublished {len(published)}, failed {len(failed)}")
          PYTHON

      - name: Validate again, now that files have changed
        if: github.event_name != 'pull_request' && steps.scan.outputs.count != '0'
        run: |
          python3 schema/validate.py .
          python3 schema/validate_manifests.py .

      # A pull request into main rather than a push, so a person sees every DOI
      # and PDF before any of it becomes part of the corpus.
      - name: Open a pull request into main
        if: github.event_name != 'pull_request' && steps.scan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="published/${{ github.run_id }}"
          git config user.name "stages"
          git config user.email "stages@fanpit.live"
          git checkout -b "$BRANCH"
          git add -A

          SUMMARY=$(python3 -c "
          import json
          d = json.load(open('/tmp/published.json'))
          for w, v, doi in d['published']:
              print(f'- {w} v{v}: {doi}')
          if d['failed']:
              print()
              print('Failed:')
              for w, v, e in d['failed']:
                  print(f'- {w} v{v}: {e}')
          ")

          git commit -m "Publish $(python3 -c "
          import json; print(len(json.load(open('/tmp/published.json'))['published']))") research version(s)

          $SUMMARY"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "Publish research versions" \
            --body "DOIs minted and PDFs built.

          $SUMMARY

          Check each DOI resolves and the Zenodo records look right before merging."
