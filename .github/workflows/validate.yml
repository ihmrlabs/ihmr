name: Validate documents

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A malformed document would break website ingestion silently,
      # so it fails here instead.
      - name: Validate front matter
        run: python3 schema/validate.py .
